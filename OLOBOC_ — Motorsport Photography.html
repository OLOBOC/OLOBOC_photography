<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const R=s=>{let x=s*9301+49297;return()=>((x=(x*9301+49297)%233280)/233280)};
const PAL={dirt:['#1b0d07','#e8431f','#f2b36b'],rain:['#06090d','#2a3a4a','#9fb4c6'],night:['#030308','#16162e','#e8431f'],drift:['#0a0a0c','#44403c','#f1ede6'],pad:['#0d0f12','#3a3f46','#c9a227']};
function art(seed,kind,w=800,h=600,bib){const r=R(seed+1),p=PAL[kind]||PAL.dirt;let pts=`0,${h} `;for(let i=0;i<=8;i++)pts+=`${i*w/8},${h*.5+r()*h*.12} `;pts+=`${w},${h}`;

let nid=20;const E=[

{id:2,n:'Rally de Asturias Histórico',loc:'Oviedo, Asturias',d:'2026-04-11',s:2026,c:'Rally',ph:260,k:'rain',st:'Publicado',t:'Evento de demostración con asfalto, lluvia y niebla.'},
{id:3,n:'Rallysprint de la Montaña',loc:'Cantabria',d:'2026-03-07',s:2026,c:'Rallysprint',ph:98,k:'dirt',st:'Publicado',t:'Evento de demostración.'},

{id:5,n:'Trackdays',loc:'Circuito, España',d:'2025-08-02',s:2025,c:'Circuito',ph:120,k:'pad',st:'Publicado',t:'Evento de demostración.'},
{id:6,n:'Motorsport Sessions',loc:'Gijón, Asturias',d:'2025-06-21',s:2025,c:'Otros',ph:75,k:'night',st:'Publicado',t:'Evento de demostración: concentración nocturna.'},
{id:7,n:'Rally de Tierra',loc:'Asturias',d:'2024-09-14',s:2024,c:'Rally',ph:210,k:'dirt',st:'Publicado',t:'Evento de demostración.'},
{id:8,n:'Rallysprint Otoño',loc:'Asturias',d:'2026-11-08',s:2026,c:'Rallysprint',ph:0,k:'rain',st:'Borrador',t:'Pendiente de subir fotografías.'}];

function photos(e){if(!e.p){const r=R(e.id*7),S=[[800,600],[600,800],[800,500],[700,700],[900,560]],K=[e.k,e.k,'night','rain','pad','drift'];e.p=Array.from({length:Math.min(18,e.ph)},(_,i)=>{const[w,h]=S[Math.floor(r()*5)];return{id:e.id+'-'+i,w,h,k:i%3?e.k:K[Math.floor(r()*6)],seed:e.id*100+i,bib:String(1+Math.floor(r()*40))}})}return e.p}

'cookies':['Política de cookies',()=>`<p>Esta demo no instala cookies ni usa analítica, publicidad ni almacenamiento local, por lo que no muestra banner: no hay nada que consentir.</p><h3>Qué cambiaría</h3><p>Si se añade analítica, incrustaciones de Instagram/TikTok u otras tecnologías sujetas a consentimiento, harán falta un sistema real con aceptar y rechazar con la misma visibilidad, configuración por categorías, sin casillas premarcadas y con posibilidad de cambiar la decisión, y esta política deberá listar las tecnologías reales.</p><h3>Detectado hoy</h3><p>Cookies: ninguna. Petición externa: Google Fonts (ver privacidad).</p>`],
'licencia-imagen':['Licencia y derechos de imagen',()=>`<p>Base configurable; requiere revisión profesional.</p><h3>Derechos de autor</h3><p>© OLOBOC_. Todos los derechos reservados salvo lo indicado aquí. Descargar una fotografía no transfiere derechos comerciales.</p><h3>Usos permitidos</h3><p>Uso personal y compartición en redes con mención a @oloboc_, sin recortar ni eliminar la marca. ${PH('confirmar condiciones')}</p><h3>Uso comercial o profesional</h3><p>Requiere licencia previa: <a href='#contact'>contacta</a>. Condiciones de venta futura: ${PH('a definir')}</p><h3>Derechos de imagen</h3><p>Fotografiar en un evento no implica autorización ilimitada de todas las personas retratadas. Se revisan solicitudes razonables de retirada, con especial atención a menores y a imágenes que puedan afectar a la privacidad. Plazo de respuesta: ${PH('plazo')}</p><p><a class='btn f' href='#contact'>Solicitar revisión o retirada</a></p>`]};
function legal(h){const[t,f]=LG[h];$app.innerHTML=`<div class='pg lg'><div class='m'>Información legal</div><h2 class='d'>${t}</h2>${f()}<p class='m' style='margin-top:40px'>Documento preparatorio. No constituye asesoramiento legal ni garantiza cumplimiento normativo.</p></div>`}
function meta(h){const e=h.startsWith('ev-')&&E.find(x=>x.id==h.slice(3)),T={archive:'Archivo de eventos',admin:'Admin (demo)'};document.title=(e?e.n+' · '+e.loc:LG[h]?LG[h][0]:T[h]||'Motorsport Photography')+' — OLOBOC_';const m=$('meta[name=description]');if(m)m.content=e?`Galería de ${e.n} (${e.c}, ${e.loc}). Fotografía de motorsport por OLOBOC_.`:'OLOBOC_: plataforma de fotografía de automovilismo. Galerías de rally, rallysprint y drift.';let j=$('#ld');if(!j){j=document.createElement('script');j.id='ld';j.type='application/ld+json';document.head.append(j)}j.textContent=e?JSON.stringify({'@context':'https://schema.org','@type':'ImageGallery',name:e.n,description:e.t,contentLocation:e.loc,creator:{'@type':'Person',name:'OLOBOC_'}}):''}
/* router */
function reveal(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});$$('.rv').forEach(x=>io.observe(x))}
function route(){const h=location.hash.slice(1)||'home';$('#nv').classList.remove('o');$$('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));document.body.classList.toggle('adm',h==='admin');
const page=h==='admin'?'admin':h==='archive'?'archive':h.startsWith('ev-')?h:LG[h]?h:'home';
if(page==='home'&&cur==='home'){$('#'+h)?.scrollIntoView({behavior:'smooth'});return}
cur=page;$app.style.animation='none';void $app.offsetHeight;$app.style.animation='';if(page==='admin')admin();else if(page==='archive')archive();else if(page==='home'){home();setTimeout(()=>h==='home'?scrollTo(0,0):$('#'+h)?.scrollIntoView(),30)}else if(LG[page])legal(page);else event(+h.slice(3));if(page!=='home'||h==='home')scrollTo(0,0);reveal();meta(h)}
addEventListener('hashchange',route);route();
const RM=matchMedia('(prefers-reduced-motion:reduce)');addEventListener('scroll',()=>{if(RM.matches)return;const t=$('.hero .t');if(t){const y=scrollY;t.style.transform=`translateY(${y*.18}px)`;t.style.opacity=Math.max(0,1-y/700)}},{passive:true});
document.addEventListener('change',ev=>{const k=ev.target.dataset.cfg;if(!k)return;let v=ev.target.type==='checkbox'?ev.target.checked:ev.target.value.trim();if((k==='ig'||k==='tt')&&v&&!/^https:\/\/[^\s<>"']+$/.test(v)){ev.target.value=CFG[k];return toast('Solo se admiten URLs https')}CFG[k]=v;toast('Ajuste guardado (demo)')});
