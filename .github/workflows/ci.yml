name: OLOBOC_ Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Client (Vite + React)
        run: |
          cd client
          npm run build

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client & Database
        run: |
          cd server
          npx prisma generate
          npx prisma db push

      - name: Seed Database
        run: |
          cd server
          npx tsx src/db/seed.ts

      - name: Run Automated Test Suite (22 Unit & Integration Tests)
        run: |
          cd server
          npx tsx test/test-runner.ts
